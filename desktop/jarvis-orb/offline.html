<!doctype html>
<html><head><meta charset="utf-8"><title>JARVIS Orb</title>
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:system-ui,sans-serif}
.w{position:fixed;right:0;bottom:0;width:168px;height:168px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px}
.o{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 45% 40%,#7fb2ff55,#0b1e3a 60%,#020814);border:1px solid #5fe1ff44;box-shadow:0 0 22px #5fe1ff22;animation:p 3s ease-in-out infinite;cursor:pointer}
@keyframes p{50%{opacity:.55}}
.t{font-size:10px;color:#9fb7d0;background:#020814cc;padding:2px 8px;border-radius:99px;text-align:center}
</style></head>
<body><div class="w"><div class="o" id="o" title="JARVIS isn't answering — click to retry"></div><div class="t" id="t">JARVIS offline</div></div>
<script>
const u = new URLSearchParams(location.search).get("url") || "http://localhost:3000";
document.getElementById("t").textContent = "JARVIS offline · " + u.replace(/^https?:\/\//, "");
const o = document.getElementById("o");
o.onmouseenter = () => window.jarvisDesktop?.setInteractive(true);
o.onmouseleave = () => window.jarvisDesktop?.setInteractive(false);
o.onclick = () => window.jarvisDesktop?.retry();
</script></body></html>
