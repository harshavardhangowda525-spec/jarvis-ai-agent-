# JARVIS's own SearXNG — free, unlimited web search for DARWIN (no API key).
# Start it with:  npm run searxng   (it also writes SEARXNG_URL to .env.local)
# Only this computer can reach it (bound to 127.0.0.1).
services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: jarvis-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:${SEARXNG_PORT:-8888}/
      # listen on IPv4 inside the container (some Docker setups have no IPv6)
      - GRANIAN_HOST=0.0.0.0
      # a private random secret, created by `npm run searxng` in searxng/.env (git-ignored)
      - SEARXNG_SECRET=${SEARXNG_SECRET:?run npm run searxng to create searxng/.env}
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "1" }
